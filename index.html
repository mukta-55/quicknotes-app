<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Write it down, find it later.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <label for="note-input">Note</label>
          <input type="text" id="note-input" />
          <select id="note-category">
            <option>Personal</option>
            <option>Work</option>
            <option>Study</option>
          </select>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message"></p>
      </section>

      <section>
        <h2>Your notes</h2>
        <input id="search-input" />
        <p id="note-count"></p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>
        QuickNotes: a simple note-taking app built with HTML, CSS and
        JavaScript.
      </p>
    </footer>
  </body>
</html>
